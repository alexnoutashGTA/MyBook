<h1>Send a message</h1>

<form #messageForm="ngForm" id="messageForm" (ngSubmit)="saveMessage(messageForm.value)">
<label for="firstname">*First Name</label>
<br>
<input type="text" placeholder="Enter firstname" id="firstname" name="firstname" required ngModel>
<br>
<br>

<label for="lastname">*Last Name</label>
<br>
<input type="text" placeholder="Enter lastname" id="lastname" name="lastname" required ngModel>
<br>
<br>

<label for="phone number">Phone Number</label>
<br>
<input type="tel" placeholder="(***) ***-****" id="phonenumber" name="phonenumber" pattern="([0-9]{3}) [0-9]{3}-[0-9]{4}" ngModel>
<br>
<br>
<input type="submit" value="Send the message">
</form>
